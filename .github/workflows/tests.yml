name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the test suite
        run: |
          set -o pipefail
          python3 test_solver.py 2>&1 | tee results.txt

      - name: Show the results in the run summary
        if: always()
        run: |
          demo() {
            local heading=$1
            shift
            echo "### $heading"
            echo
            echo '```console'
            echo "$ python script.py $*"
            python3 script.py "$@"
            echo '```'
            echo
          }
          {
            echo "## Countdown solver tests"
            echo
            echo '```'
            cat results.txt
            echo '```'
            echo
            demo "A game it solves" 25 50 75 100 3 6 952
            demo "A game nobody can solve, so it gets as close as possible" 1 3 7 10 25 50 831
          } >> "$GITHUB_STEP_SUMMARY"
