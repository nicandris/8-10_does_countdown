name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the test suite
        run: |
          set -o pipefail
          python3 test_solver.py 2>&1 | tee results.txt

      - name: Show the results in the run summary
        if: always()
        run: |
          {
            echo "## Countdown solver tests"
            echo
            echo '```'
            cat results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
